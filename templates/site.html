<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BioInvest</title>

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">

<style>

:root{
    --bg-color:#f8faf9;
    --primary-color:#1a4a2e;
    --accent-color:#a4de02;
    --text-dark:#1a1a1a;
    --text-light:#ffffff;
    --card-bg:#ffffff;
    --border-gray:#f0f0f0;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color:var(--bg-color);
}

/* TOPO */

.top-bar{
    background-color:var(--primary-color);
    color:white;
    padding:5px 50px;
    text-align:right;
    font-size:0.8rem;
}

nav.main-nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 50px;
    background:white;
}

.logo{
    font-family:'Montserrat', sans-serif;
    font-size:1.8rem;
    font-weight:700;
    color:var(--primary-color);
}

.nav-links{
    display:flex;
    gap:25px;
    align-items:center;
}

.nav-links a{
    text-decoration:none;
    color:var(--text-dark);
    font-weight:600;
    font-family:'Montserrat', sans-serif;
}

/* HERO */

header{
    background-image:
    linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)),
    url('https://images.unsplash.com/photo-1542273917363-3b1817f69a2d?q=80&w=1600');

    background-size:cover;
    background-position:center;

    height:400px;

    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;

    color:white;
    text-align:center;
}

header h1{
    font-family:'Montserrat', sans-serif;
    font-size:4rem;
}

header p{
    font-size:1.2rem;
    border-top:2px solid var(--accent-color);
    padding-top:10px;
    margin-top:10px;
}

/* FILTRO */

.filter-container{
    max-width:800px;
    margin:-50px auto 40px;
    position:relative;
    z-index:10;
}

.filter-section{
    background:white;
    padding:25px 40px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,0.1);
    border-bottom:5px solid var(--accent-color);
}

.filter-section label{
    display:block;
    font-weight:700;
    margin-bottom:10px;
}

select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:5px;
    font-size:1rem;
}

/* CARDS */

.container{
    max-width:1100px;
    margin:0 auto 60px;
    padding:0 25px;
}

.card{
    background:white;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 4px 15px rgba(0,0,0,0.05);
    border-left:10px solid var(--primary-color);
    overflow:hidden;
}

.card-header{
    padding:30px;
}

.card-header h3{
    color:var(--primary-color);
    font-size:1.8rem;
    margin-bottom:10px;
}

.short-desc{
    color:#666;
    margin-bottom:20px;
    line-height:1.6;
}

.actions{
    display:flex;
    gap:12px;
}

.btn-visit{
    background:var(--primary-color);
    color:white;
    padding:12px 24px;
    border-radius:6px;
    text-decoration:none;
    font-weight:bold;
}

.btn-desc{
    background:#f1f3f2;
    color:var(--primary-color);
    padding:12px 24px;
    border-radius:6px;
    border:none;
    cursor:pointer;
    font-weight:bold;
}

/* ACORDEÃO */

.card-content{
    max-height:0;
    overflow:hidden;
    transition:max-height 0.4s ease-out;

    background:#fafcfb;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:15px 40px;

    padding:0 30px;
}

.card.active .card-content{
    max-height:1200px;
    padding:25px 30px;
    border-top:1px solid var(--border-gray);
}

.info-item strong{
    display:block;
    margin-bottom:3px;
}

.info-item span{
    color:#555;
}

/* RESPONSIVO */

@media(max-width:768px){

    nav.main-nav{
        flex-direction:column;
        gap:15px;
    }

    header h1{
        font-size:2.5rem;
    }

    .card-content{
        grid-template-columns:1fr;
    }

}

</style>
</head>

<body>

<div class="top-bar">
🌐 Português
</div>

<nav class="main-nav">

    <div class="logo">
        🍃 BioInvest
    </div>

    <div class="nav-links">
        <a href="#">Página Inicial</a>
        <a href="#">Fundos</a>
        <a href="#">Sobre</a>
    </div>

</nav>

<header>

    <h1>BioInvest</h1>

    <p>
        Semeando o futuro dos seus investimentos
    </p>

</header>

<div class="filter-container">

    <div class="filter-section">

        <label>
            Buscar oportunidade:
        </label>

        <select id="setor" onchange="filtrar()">

            <option value="todos">
                Todas
            </option>

            <option value="clima">
                Clima
            </option>

            <option value="energia">
                Energia
            </option>

            <option value="ambiental">
                Ambiental
            </option>

        </select>

    </div>

</div>

<div class="container">

    <div id="lista"></div>

</div>

<script>

async function carregarDados(){

    const resposta =
    await fetch('/api/bancos');

    const dados =
    await resposta.json();

    const lista =
    document.getElementById('lista');

    lista.innerHTML = '';

    dados.forEach((item, index) => {

        /*
            AJUSTE DOS CAMPOS
            Aqui você altera conforme o JSON
        */

        const nome =
        item.nome ||
        item["nome da oportunidade"] ||
        "Sem nome";

        const instituicao =
        item.instituicao ||
        "Não informado";

        const descricao =
        item.descricao ||
        item["descrição da oportunidade"] ||
        "Sem descrição";

        const site =
        item.link ||
        item.site ||
        "#";

        const setor =
        item.setor ||
        "clima";

        const pais =
        item.pais ||
        "Não informado";

        const area =
        item["área elegível"] ||
        "Não informado";

        const valor =
        item["valor por projeto"] ||
        "Não informado";

        const moeda =
        item.moeda ||
        "Não informado";

        const card =
        document.createElement('div');

        card.className = 'card';

        card.setAttribute(
            'data-setor',
            setor.toLowerCase()
        );

        card.innerHTML = `

            <div class="card-header">

                <h3>${nome}</h3>

                <p class="short-desc">
                    ${descricao}
                </p>

                <div class="actions">

                    <a
                        href="${site}"
                        target="_blank"
                        class="btn-visit"
                    >
                        Visitar Site
                    </a>

                    <button
                        class="btn-desc"
                        onclick="toggleAccordion(this)"
                    >
                        Descrição ⌵
                    </button>

                </div>

            </div>

            <div class="card-content">

                <div class="info-item">
                    <strong>Instituição</strong>
                    <span>${instituicao}</span>
                </div>

                <div class="info-item">
                    <strong>País</strong>
                    <span>${pais}</span>
                </div>

                <div class="info-item">
                    <strong>Área Elegível</strong>
                    <span>${area}</span>
                </div>

                <div class="info-item">
                    <strong>Setor</strong>
                    <span>${setor}</span>
                </div>

                <div class="info-item">
                    <strong>Moeda</strong>
                    <span>${moeda}</span>
                </div>

                <div class="info-item">
                    <strong>Valor por Projeto</strong>
                    <span>${valor}</span>
                </div>

            </div>

        `;

        lista.appendChild(card);

    });

}

function toggleAccordion(btn){

    const card =
    btn.closest('.card');

    card.classList.toggle('active');

}

function filtrar(){

    const setor =
    document.getElementById('setor').value;

    const cards =
    document.querySelectorAll('.card');

    cards.forEach(card => {

        if(
            setor === 'todos' ||
            card.dataset.setor.includes(setor)
        ){
            card.style.display = 'block';
        }
        else{
            card.style.display = 'none';
        }

    });

}

carregarDados();

</script>

</body>
</html>
